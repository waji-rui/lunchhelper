name: Build and Release (portable zip)

# Builds LunchHelper.exe on a GitHub-hosted Windows runner and publishes a
# PORTABLE ZIP (exe + WebView2 DLLs + plugins + docs) to the GitHub Release.
#
# Triggers:
#   - pushing a tag like v1.0.0
#   - manual "Run workflow" (workflow_dispatch)
#
# IMPORTANT: This project currently ships UNSIGNED (SignPath Foundation declined
# the OSS application). uiAccess therefore stays "false" in app.manifest — an
# unsigned exe with uiAccess="true" is REFUSED by Windows at launch (it cannot
# verify the digital signature). For a strong top-most lock screen, extract the
# zip into C:\Program Files\ (protected directory) or run as administrator.
# Re-enable the uiAccess flip in CI only after a trusted code-signing
# certificate is obtained.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write   # required to upload release assets

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build (Release)
        run: msbuild LunchHelper.csproj /p:Configuration=Release /p:Platform="Any CPU"

      - name: Pack portable ZIP
        run: powershell -NoProfile -ExecutionPolicy Bypass -File pack.ps1 -ReleaseDir bin\Release -Version ${{ github.ref_name }} -OutDir ${{ github.workspace }}

      - name: Publish ZIP to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: '${{ github.workspace }}\LunchHelper-${{ github.ref_name }}.zip'
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
